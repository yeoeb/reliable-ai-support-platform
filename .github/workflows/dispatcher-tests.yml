name: Dispatcher Tests

on:
  pull_request:
    paths:
      - "scripts/codex_dispatch.py"
      - "tests/test_codex_dispatch.py"
      - "tests/test_codex_publish.py"
      - "tests/test_codex_publish.py"
      - ".github/workflows/dispatcher-tests.yml"
  push:
    branches:
      - develop
    paths:
      - "scripts/codex_dispatch.py"
      - "tests/test_codex_dispatch.py"
      - ".github/workflows/dispatcher-tests.yml"

permissions:
  contents: read

jobs:
  dispatcher-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile dispatcher
        run: python -m py_compile scripts/codex_dispatch.py

      - name: Run dispatcher control-plane tests
        run: >-
          python -m pytest
          tests/test_codex_dispatch.py
          tests/test_codex_publish.py
          -q
