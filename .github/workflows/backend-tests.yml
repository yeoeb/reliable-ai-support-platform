name: Backend Verification

on:
  pull_request:
    paths:
      - "app/**"
      - "migrations/**"
      - "tests/**"
      - "requirements/**"
      - "pyproject.toml"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - develop
      - "feature/**"
    paths:
      - "app/**"
      - "migrations/**"
      - "tests/**"
      - "requirements/**"
      - "pyproject.toml"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: support_platform_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d support_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: support_platform_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test-password
      JWT_SECRET_KEY: test-jwt-secret-value
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Upgrade database to Alembic head
        run: python -m alembic upgrade head

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Downgrade latest migration
        run: python -m alembic downgrade -1

      - name: Re-upgrade to Alembic head
        run: python -m alembic upgrade head
